name: downloads-badge

# プラットフォーム別 npm パッケージ5つの18か月 DL 数を合計し、その過去最大値を
# shields.io の endpoint バッジ用 JSON(downloads.json)として生成する。
# 生成物と最大値(downloads-max.txt)は専用の `badges` ブランチへ force-push する。
# 本体 acac-cli は薄いシムでキャッシュに乗りやすく過小に出るため合計には含めない([[ADR-0009]], [[ADR-0010]])。
on:
  schedule:
    # 毎日 00:00 UTC に更新(npm の download API は前日ぶんまでの集計)。
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Compute max downloads and publish badge JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 各 install はちょうど1つのプラットフォームバイナリを引くので、5つの合計が
          # 実 install 数の近似になる(本体 acac-cli は含めない)。
          PKGS=(acac-linux-x64 acac-linux-arm64 acac-darwin-arm64 acac-darwin-x64 acac-win32-x64)

          # shields.io の npm/d18m と同じ range API を使う。npm の range API は複数
          # パッケージを一括取得できないため、個別に取得して日別 DL 数を合計する。
          CURRENT=0
          for PKG in "${PKGS[@]}"; do
            DOWNLOADS=$(curl -fsSL "https://api.npmjs.org/downloads/range/1000-01-01:3000-01-01/${PKG}" \
              | jq '[.downloads[]? | (.downloads // 0)] | add // 0')
            echo "${PKG} 18-month downloads: ${DOWNLOADS}"
            CURRENT=$((CURRENT + DOWNLOADS))
          done
          echo "current 18-month platform package downloads: ${CURRENT}"

          PREVIOUS_MAX=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/badges/downloads-max.txt" 2>/dev/null || echo 0)
          if ! [[ "${PREVIOUS_MAX}" =~ ^[0-9]+$ ]]; then
            PREVIOUS_MAX=0
          fi
          echo "previous max downloads: ${PREVIOUS_MAX}"

          MAX=${PREVIOUS_MAX}
          if (( CURRENT > PREVIOUS_MAX )); then
            MAX=${CURRENT}
          fi
          echo "badge downloads: ${MAX}"

          # 生成物だけを置く orphan ブランチを毎回作り直して force-push する(履歴を溜めない)。
          mkdir badge && cd badge
          printf '{"schemaVersion":1,"label":"npm downloads","message":"%s total","color":"blue"}\n' "${MAX}" > downloads.json
          printf '%s\n' "${MAX}" > downloads-max.txt
          printf '%s\n' "${CURRENT}" > downloads-current-18m.txt
          git init -q
          git checkout -q -b badges
          git add downloads.json downloads-max.txt downloads-current-18m.txt
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(badge): npm downloads ${MAX} total"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
